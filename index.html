 const textIn=()=>textarea('Input text','inputText','Paste or type your content here...');

 if(k==='sinhala-unicode-keyboard'){navigator.clipboard.writeText($('#keyboardText').value).then(()=>setResult('<b>Text copied.</b>'));return;}
 if(k==='currency-converter')return currency().catch(e=>setResult(`<span class="error-msg">${esc(e.message)}</span>`));
 if(['age-calculator','date-difference-calculator','percentage-calculator','discount-calculator','loan-calculator','salary-calculator','savings-calculator','bmi-calculator','vat-calculator','unit-converter','time-converter'].includes(k))return runCalculator(k);
 if(k.endsWith('qr-generator')||k==='qr-code-generator'||k==='barcode-generator')return runQr(k).catch(e=>setResult(`<span class="error-msg">${esc(e.message)}</span>`));
 if(['al-grade-calculator','ol-grade-calculator','gpa-calculator','study-timetable-maker','exam-countdown','study-time-calculator'].includes(k))return runEducation(k);
 throw Error('This tool is not configured.');
 }catch(e){setResult(`<span class="error-msg">${esc(e.message||'Something went wrong. Please check your input.')}</span>`);}}
$('#runTool')?.addEventListener('click',run);$('#resetTool')?.addEventListener('click',()=>location.reload());
if(k==='sinhala-unicode-keyboard'){const chars=['අ','ආ','ඇ','ඈ','ඉ','ඊ','උ','ඌ','එ','ඒ','ඔ','ඕ','ක','ඛ','ග','ඝ','ච','ජ','ට','ඩ','ත','ද','න','ප','බ','ම','ය','ර','ල','ව','ස','හ','ළ','්','ා','ැ','ෑ','ි','ී','ු','ූ','ෙ','ේ','ො','ෝ','ං','ඃ','෴',' ','⌫'];const wrap=$('#sinhalaKeys');wrap.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:6px';wrap.innerHTML=chars.map(ch=>`<button type="button" class="filter-chip" data-key="${esc(ch)}" style="font-size:17px;padding:9px">${ch===' '?'␠':ch}</button>`).join('');wrap.addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(!b)return;const ta=$('#keyboardText'),ch=b.dataset.key;ta.value=ch==='⌫'?ta.value.slice(0,-1):ta.value+ch;ta.focus();});}
})();
</script>
